<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TransitOps | Fuel &amp; Expenses</title>
  <link rel="stylesheet" href="css/global.css">
</head>

<body data-page="fuel">
  <div class="app">
    <main class="main">
      <header class="topbar">
        <input class="search" placeholder="Search..." data-search="fuel">
        <div class="user" id="currentRole">Role: &mdash; <span class="avatar">T</span></div>
      </header>

      <section class="page fuel-page">
        <div class="fuel-section-heading">
          <h1>Fuel Logs</h1>
          <div class="fuel-actions">
            <button class="button" type="button" id="showFuelForm">+ Log Fuel</button>
            <button class="button" type="button" id="showExpenseForm">+ Add Expense</button>
          </div>
        </div>

        <div id="fuelEntryPanel" class="fuel-entry-panel" hidden>
          <form id="fuelForm" class="compact-entry-form">
            <div class="form-heading"><h2>Log Fuel</h2><button class="close-entry" type="button" data-close-entry>&times;</button></div>
            <div id="fuelNotice" class="notice"></div>
            <div class="compact-fields">
              <div class="field"><label>Vehicle *</label><select id="fuelVehicle" required></select></div>
              <div class="field"><label>Date *</label><input id="fuelDate" type="date" required></div>
              <div class="field"><label>Liters *</label><input id="fuelLiters" type="number" min="0.01" step="0.01" required></div>
              <div class="field"><label>Fuel cost *</label><input id="fuelCost" type="number" min="0" required></div>
              <button class="button" type="submit">Save Fuel</button>
            </div>
          </form>
        </div>

        <div id="expenseEntryPanel" class="fuel-entry-panel" hidden>
          <form id="expenseForm" class="compact-entry-form">
            <div class="form-heading"><h2>Add Expense</h2><button class="close-entry" type="button" data-close-entry>&times;</button></div>
            <div id="expenseNotice" class="notice"></div>
            <div class="compact-fields">
              <div class="field"><label>Vehicle *</label><select id="expenseVehicle" required></select></div>
              <div class="field"><label>Date *</label><input id="expenseDate" type="date" required></div>
              <div class="field"><label>Expense type *</label><select id="expenseType"><option>Toll</option><option>Parking</option><option>Permit</option><option>Other</option></select></div>
              <div class="field"><label>Cost *</label><input id="expenseCost" type="number" min="0" required></div>
              <button class="button" type="submit">Save Expense</button>
            </div>
          </form>
        </div>

        <div class="fuel-table-wrap">
          <table class="fuel-table">
            <thead><tr><th>Vehicle</th><th>Date</th><th>Liters</th><th>Fuel cost</th></tr></thead>
            <tbody id="fuelRows"></tbody>
          </table>
          <div id="fuelEmpty" class="fuel-empty">No fuel logs yet. Use <b>+ Log Fuel</b> to add your first record.</div>
        </div>

        <section class="expense-section">
          <h2>Other Expenses (Toll / Misc)</h2>
          <div class="fuel-table-wrap">
            <table class="fuel-table expense-table">
              <thead><tr><th>Trip / Ref</th><th>Vehicle</th><th>Toll</th><th>Other</th><th>Maint. (linked)</th><th>Total</th><th>Status</th></tr></thead>
              <tbody id="otherExpenseRows"></tbody>
            </table>
            <div id="expenseEmpty" class="fuel-empty">No other expenses recorded.</div>
          </div>
        </section>

        <div class="fuel-total"><b>Total operational cost (auto)</b><span>= Fuel + Maint. + Other</span><strong id="operationalTotal">&#8377;0</strong></div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/drivers.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/pages/fuel.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
